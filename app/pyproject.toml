# Configuration de Ruff : vérification du style et des erreurs courantes du code Python.
# Lancer depuis app/ : `ruff check .` (erreurs) et `ruff format --check .` (mise en forme).

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # style (pycodestyle)
    "W",   # avertissements de style
    "F",   # erreurs (variables inutilisées, imports manquants…)
    "I",   # ordre des imports
    "B",   # pièges fréquents (flake8-bugbear)
    "UP",  # syntaxe Python moderne
    "DJ",  # bonnes pratiques Django
]
