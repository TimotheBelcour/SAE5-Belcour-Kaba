<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Jardins de Cocagne{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand" href="{% url 'accueil:index' %}">Jardins de Cocagne</a>
      <a class="btn btn-outline-light btn-sm" href="{% url 'admin:index' %}">Administration</a>
    </div>
  </nav>

  <main class="container py-4 flex-grow-1">
    {% block contenu %}{% endblock %}
  </main>

  <footer class="py-3 bg-light text-center text-body-secondary small">
    SAÉ 5 – Timothé Belcour et Abdoulaye Kaba – IUT de Saint-Dié-des-Vosges
  </footer>
</body>
</html>
